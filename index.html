<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPPF Money</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
/* JPPF Money — ocean theme, matched to the Hairpin scheduler. */
:root{
  --bg:#0f151b; --panel:#151d26; --panel2:#19222c; --line:#243140; --line2:#33445a;
  --text:#e3eaf1; --head:#dcebf6; --muted:#8497a8; --dim:#5f7385;
  --accent:#4f9fd8; --accent-ink:#07131d; --accent-soft:#4f9fd81c;
  --green:#9cd5b4; --green-bg:#4a9e6e26; --red:#ed7777; --red-bg:#ed77771f;
  --amber:#ead58e; --amber-bg:#ead58e1c; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1a2530,#151d26);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:'EB Garamond',Georgia,serif;font-size:23px;color:var(--head);white-space:nowrap}
.brand b{color:var(--accent);font-weight:600}
.tabs{display:flex;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:9px}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
.tab:hover{color:var(--head)}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
main{max-width:1100px;margin:auto;padding:22px 18px 90px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:border-color .15s,filter .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--head);border-color:var(--line2)}
.btn.danger{background:transparent;color:var(--red);border-color:#ed777740}
.btn.small{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}

/* cards and text */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card + .card{margin-top:16px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-head h3{font-size:15px;font-weight:700;color:var(--head)}
.card-head .right{margin-left:auto;display:flex;gap:8px}
.hint{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.empty{padding:18px 4px;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}

/* quarter page */
.qnav{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.qnav h1{font-family:'EB Garamond',Georgia,serif;font-size:34px;font-weight:400;color:var(--head);line-height:1.1}
.qnav .months{font-size:13px;color:var(--muted)}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--head);font-size:18px;cursor:pointer}
.arrow:hover{border-color:var(--accent);color:var(--accent)}
.qnav .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sum{max-width:560px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sum-row .what small{display:block;font-size:12px;color:var(--muted)}
.sum-row .amt{font-weight:600;white-space:nowrap}
.sum-row.minus .amt{color:#c3cfdb}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:4px;border-top:2px solid var(--accent)}
.sum-total .what{font-size:16px;font-weight:700;color:var(--head)}
.sum-total .amt{font-family:'EB Garamond',Georgia,serif;font-size:34px;color:var(--head)}
.owed-banner{margin-top:14px;display:block;background:var(--amber-bg);border:1px solid #ead58e40;color:var(--amber);border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:12px;padding:3px 10px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);color:#c3cfdb}
.chip b{color:var(--head);font-weight:600}

/* lists */
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel2)}
.row .date{width:78px;flex-shrink:0;font-size:12px;color:var(--muted)}
.row .main{flex:1;min-width:0}
.row .main .t{font-weight:600;color:var(--head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:600;white-space:nowrap}
.row .acts{display:flex;gap:6px}
.group-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);padding:14px 6px 6px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.gray{background:var(--panel2);color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{max-width:280px}
.seg{display:flex;gap:4px}
.seg button{border:1px solid var(--line2);background:var(--panel);color:var(--muted);border-radius:16px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--accent);color:var(--head);background:var(--accent-soft)}

/* forms */
.field{margin-bottom:14px}
.field label,.lbl{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:14px}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #4f9fd833}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.lines .line{display:flex;gap:8px;margin-bottom:6px}
.lines .line input:first-child{flex:2}
.lines .line input.amt{flex:1;max-width:130px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text)}
.check input{width:auto}
.total-line{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border:1px solid #4f9fd840;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.total-line b{font-size:18px;color:var(--head)}
.sub{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.sub h4{font-size:13px;color:var(--head);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sub h4 .btn{margin-left:auto}

/* modal */
.back{position:fixed;inset:0;background:#070b10cc;backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:620px;padding:22px 22px 18px;box-shadow:0 24px 70px #000a}
.modal h2{font-family:'EB Garamond',Georgia,serif;font-weight:400;font-size:24px;color:var(--head);margin-bottom:16px}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.modal-acts .left{margin-right:auto}

/* lock + loading */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock{width:100%;max-width:360px;text-align:center}
.lock h1{font-family:'EB Garamond',Georgia,serif;font-weight:400;font-size:38px;color:var(--head)}
.lock h1 b{color:var(--accent);font-weight:600}
.lock p{color:var(--muted);margin:6px 0 18px}
.lock input{text-align:center;font-size:18px;margin-bottom:10px}
.lock .err{color:var(--red);font-size:13px;min-height:20px}
.spinner{width:22px;height:22px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* save status */
.savebar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:8px 16px;font-size:13px;z-index:60;box-shadow:0 8px 30px #0008;display:flex;gap:10px;align-items:center}
.savebar.ok{color:var(--green)}
.savebar.bad{color:var(--red);border-color:#ed777760}

/* invoice paper */
.paper{background:#fff;color:#1b2530;border-radius:10px;max-width:800px;margin:0 auto;padding:44px 48px;box-shadow:0 10px 40px #0009}
.paper .ph{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:22px;margin-bottom:24px;border-bottom:3px solid #4f9fd8}
.paper .biz{font-size:13px;line-height:1.7;color:#4a5a6a}
.paper .biz strong{display:block;font-size:19px;color:#10202e;margin-bottom:2px}
.paper .meta{text-align:right;font-size:13px;line-height:1.7;color:#4a5a6a}
.paper .meta .word{font-family:'EB Garamond',Georgia,serif;font-size:36px;color:#2f7fbf;letter-spacing:2px;line-height:1}
.paper .meta b{color:#10202e}
.paper .lab{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#8a98a6;margin-bottom:3px}
.paper .blk{margin-bottom:18px;font-size:14px;white-space:pre-line}
.paper table{width:100%;border-collapse:collapse;margin:8px 0 20px}
.paper th{background:#eef5fb;color:#4a5a6a;font-size:11px;text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:9px 12px}
.paper td{padding:10px 12px;border-bottom:1px solid #e6edf3;font-size:14px}
.paper td.a,.paper th.a{text-align:right;white-space:nowrap}
.paper tr.tot td{border-top:2px solid #4f9fd8;border-bottom:0;font-weight:700;font-size:16px;color:#10202e}
.paper .pay{background:#f4f8fc;border-radius:8px;padding:16px 18px;font-size:13px}
.paper .pay div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #e3ebf2}
.paper .pay div:last-child{border-bottom:0}
.paper .thanks{margin-top:22px;font-size:13px;color:#6a7a8a}
.invbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.invbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:760px){
  .top-in{gap:10px;padding:10px 12px}
  .top-actions{margin-left:0;width:100%}
  .top-actions .btn{flex:1;padding:8px 8px}
  .top-actions .btn.ghost{flex:0 0 auto}
  main{padding:16px 12px 90px}
  .grid2,.r2,.r3{grid-template-columns:1fr}
  .qnav h1{font-size:28px}
  .qnav .right{margin-left:0;width:100%}
  .back{padding:0}
  .modal{border-radius:0;min-height:100vh;max-width:none;border:0}
  input,select,textarea{font-size:16px}
  .row .date{width:62px}
  .paper{padding:24px 18px}
  .paper .meta{text-align:left}
  .sum-total .amt{font-size:28px}
}
@media print{
  @page{margin:.5in}
  body,html{background:#fff}
  .no-print,.top,.savebar{display:none!important}
  main{padding:0;max-width:none}
  .paper{box-shadow:none;padding:0;max-width:none;border-radius:0}
}
</style>
</head>
<body>

<div id="lockScreen" class="center" hidden>
  <div class="lock">
    <h1><b>JPPF</b> Money</h1>
    <p>Enter your passcode</p>
    <input id="passInput" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')unlock()">
    <div class="err" id="passErr"></div>
    <button class="btn primary" style="width:100%" onclick="unlock()">Unlock</button>
  </div>
</div>

<div id="loadingScreen" class="center" hidden><div class="muted"><span class="spinner"></span>Opening your books…</div></div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><b>JPPF</b> Money</div>
      <nav class="tabs" id="tabs"></nav>
      <div class="top-actions">
        <button class="btn primary" onclick="openExpense()">+ Expense</button>
        <button class="btn" onclick="openPayment()">+ Payment in</button>
        <button class="btn" onclick="openJob()">+ Job</button>
        <button class="btn ghost small" title="Reload from the spreadsheet" onclick="reload()">↻</button>
        <button class="btn ghost small" title="Forget passcode on this device" onclick="lockApp()">Lock</button>
      </div>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="modalRoot"></div>
<div id="saveBar" class="savebar" hidden></div>

<script>
// ============================================================ settings you might change
var API_URL = "https://script.google.com/macros/s/AKfycbwL8gJGxHafx-EPG-_ds0IpRLvX1Efe23kIyCRjcs-SRGjTCE_2fYVDVpqbh6mpuQFg/exec";

// What prints at the top of every invoice.
var BUSINESS = {
  name: "John Patrick Portrait & Film LLC",
  address: "15623 Waldwick Drive\nTomball, Texas 77377",
  email: "JohnPatrickPortrait@gmail.com",
  contractor: "John Patrick Druzbik",
  payTo: [
    ["Zelle", "JohnPatrickPortrait@gmail.com"],
    ["Debit or credit", "Pay.JohnPatrickPortrait.com"],
    ["Venmo", "@JohnPatrickFilm"],
    ["PayPal", "@JohnPatrickFilm"]
  ]
};
var DEFAULT_TAX_RATE = 8.25;   // Lubbock sales tax %
var MILEAGE_RATE = 0.70;       // $ per mile used by the mileage helper

// ============================================================ state
var D = { jobs: [], invoices: [], contracts: [], expenses: [], payments: [], settings: {} };
var UI = { tab: "quarter", q: null, search: "", jobFilter: "all", invoiceId: null };
var KEY = "";
try { KEY = localStorage.getItem("jppfKey") || ""; } catch (e) {}

// ============================================================ small helpers
function $(id) { return document.getElementById(id); }
function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
// Builds a safe onclick="fn(args)" attribute.
function on(fn) {
  var args = Array.prototype.slice.call(arguments, 1).map(function (a) { return JSON.stringify(a == null ? "" : a); });
  return 'onclick="' + esc(fn + "(" + args.join(",") + ")") + '"';
}
function num(v) { var n = parseFloat(String(v == null ? "" : v).replace(/[$,\s]/g, "")); return isNaN(n) ? 0 : n; }
function r2(n) { return Math.round(n * 100) / 100; }
function money(n) {
  n = r2(num(n));
  var s = Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? "−$" : "$") + s;
}
function pad(n) { return (n < 10 ? "0" : "") + n; }
function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function dateOnly(v) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v || "")); return m ? m[0] : ""; }
var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function niceDate(v, withYear) {
  var d = dateOnly(v); if (!d) return "No date";
  var p = d.split("-");
  return MONTHS[+p[1] - 1] + " " + (+p[2]) + (withYear === false ? "" : ", " + p[0]);
}
function shortDate(v) { var d = dateOnly(v); if (!d) return "—"; var p = d.split("-"); return MONTHS[+p[1] - 1] + " " + (+p[2]) + " '" + p[0].slice(2); }
function isTrue(v) { return v === true || String(v).toUpperCase() === "TRUE"; }
function newId(prefix) { return prefix + Date.now() + Math.floor(Math.random() * 10000); }
function parseMaybe(v, fallback) {
  if (v && typeof v === "object") return v;
  try { return JSON.parse(v || ""); } catch (e) { return fallback; }
}
function setting(key, fallback) { var v = D.settings[key]; return Array.isArray(v) && v.length ? v : fallback; }
function uniq(list) { var seen = {}; return list.filter(function (x) { x = String(x || "").trim(); if (!x || seen[x.toLowerCase()]) return false; seen[x.toLowerCase()] = 1; return true; }); }

// ============================================================ quarters
var QMONTHS = ["January – March", "April – June", "July – September", "October – December"];
function qOf(v) { var d = dateOnly(v); if (!d) return null; return d.slice(0, 4) + "-Q" + Math.ceil(+d.slice(5, 7) / 3); }
function qParts(k) { return { y: +k.slice(0, 4), q: +k.slice(6) }; }
function qShift(k, n) { var p = qParts(k), i = p.y * 4 + (p.q - 1) + n; return Math.floor(i / 4) + "-Q" + (i % 4 + 1); }
function qLabel(k) { var p = qParts(k); return "Q" + p.q + " " + p.y; }

// ============================================================ money logic
function jobById(id) { return D.jobs.find(function (j) { return j.ID === id; }); }
function paymentsFor(jobId) { return D.payments.filter(function (p) { return p.JobID === jobId; }); }
function invoicesFor(jobId) { return D.invoices.filter(function (i) { return i.JobID === jobId; }); }
// What the client paid (before the processor took its fee).
function payGross(p) { var g = num(p.GrossAmount); return g || r2(num(p.NetAmount) + num(p.Fees)); }
function payNet(p) { var n = num(p.NetAmount); return n || r2(payGross(p) - num(p.Fees)); }
function extrasOf(job) { var pd = parseMaybe(job.PipelineData, {}) || {}; return Array.isArray(pd.billableItems) ? pd.billableItems : []; }

function jobMoney(job) {
  var total = r2(num(job.GrossTotal));
  var paid = r2(paymentsFor(job.ID).reduce(function (s, p) { return s + payGross(p); }, 0));
  var owed = r2(total - paid);
  var m = { total: total, paid: paid, owed: 0, label: "", cls: "gray", owes: false };
  if (total < 0) { m.label = "Cost"; }
  else if (total === 0) { m.label = "No charge"; }
  else if (owed <= 0.009) { m.label = "Paid"; m.cls = "green"; }
  else if (isTrue(job.PaymentResolved)) { m.label = "Written off"; }
  else { m.owed = owed; m.owes = true; m.cls = "red"; m.label = paid > 0 ? "Owes " + money(owed) : "Unpaid"; }
  return m;
}
// Share of a payment that is sales tax, based on the job's tax amount.
function taxInside(p) {
  var j = jobById(p.JobID); if (!j) return 0;
  var gross = num(j.GrossTotal), tax = num(j.TaxAmount);
  if (gross <= 0 || tax <= 0) return 0;
  return r2(payGross(p) * tax / gross);
}
function quarterNumbers(k) {
  var pays = D.payments.filter(function (p) { return qOf(p.DateReceived) === k; });
  var exps = D.expenses.filter(function (e) { return qOf(e.Date) === k; });
  var n = { pays: pays, exps: exps, moneyIn: 0, tax: 0, fees: 0, spent: 0 };
  pays.forEach(function (p) { n.moneyIn += payGross(p); n.tax += taxInside(p); n.fees += num(p.Fees); });
  exps.forEach(function (e) { n.spent += num(e.Amount); });
  n.moneyIn = r2(n.moneyIn); n.tax = r2(n.tax); n.fees = r2(n.fees); n.spent = r2(n.spent);
  n.kept = r2(n.moneyIn - n.tax - n.fees - n.spent);
  return n;
}
function owingJobs() {
  return D.jobs.filter(function (j) { return jobMoney(j).owes; })
    .sort(function (a, b) { return dateOnly(a.EventDate).localeCompare(dateOnly(b.EventDate)); });
}
function invoiceNote(jobId) {
  var inv = invoicesFor(jobId).sort(function (a, b) { return num(b.InvoiceNumber) - num(a.InvoiceNumber); })[0];
  if (!inv) return '<span class="pill amber">No invoice yet</span>';
  if (String(inv.Status).toLowerCase() === "draft") return '<span class="pill amber">Invoice #' + esc(inv.InvoiceNumber) + ' not sent</span>';
  return '<span class="pill blue">Invoice #' + esc(inv.InvoiceNumber) + ' sent</span>';
}
function daysSince(v) { var d = dateOnly(v); if (!d) return ""; var ms = new Date(today() + "T12:00:00") - new Date(d + "T12:00:00"); return Math.max(0, Math.round(ms / 864e5)); }

// ============================================================ talking to the spreadsheet
function callApi(params) {
  params.key = KEY;
  if (window.__sandboxApi) return window.__sandboxApi(params);
  return new Promise(function (resolve) {
    var cb = "jppf_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    var s = document.createElement("script");
    var done = function (res) { clearTimeout(t); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); resolve(res); };
    var t = setTimeout(function () { done({ success: false, error: "The spreadsheet took too long to answer." }); }, 60000);
    window[cb] = done;
    s.onerror = function () { done({ success: false, error: "Could not reach the spreadsheet." }); };
    var qs = Object.keys(params).map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
    s.src = API_URL + "?" + qs + "&callback=" + cb;
    document.body.appendChild(s);
  });
}

// Writes go out one at a time, in order.
var writeQueue = Promise.resolve(), pendingWrites = 0, saveTimer = null;
function save(payload) {
  pendingWrites++;
  showSave("Saving…", "");
  writeQueue = writeQueue.then(function () {
    return callApi({ payload: JSON.stringify(payload) });
  }).then(function (res) {
    pendingWrites--;
    if (res && res.success) {
      if (!pendingWrites) showSave("Saved ✓", "ok", 1800);
    } else if (res && res.error === "locked") {
      showSave("Passcode no longer works — unlock again.", "bad");
      lockApp();
    } else {
      showSave("Didn't save: " + ((res && res.error) || "unknown problem") + ' <button class="btn small" onclick="reload()">Reload</button>', "bad");
    }
  });
  return writeQueue;
}
function showSave(html, cls, hideAfter) {
  var b = $("saveBar");
  clearTimeout(saveTimer);
  b.className = "savebar " + (cls || "");
  b.innerHTML = html;
  b.hidden = false;
  if (hideAfter) saveTimer = setTimeout(function () { b.hidden = true; }, hideAfter);
}

function loadAll() {
  return callApi({ action: "getAll" }).then(function (res) {
    if (!res || !res.success) return res || { success: false };
    ["jobs", "invoices", "contracts", "expenses", "payments"].forEach(function (k) { D[k] = res[k] || []; });
    D.settings = res.settings || {};
    D.jobs.forEach(function (j) { j.EventDate = dateOnly(j.EventDate) || j.EventDate; });
    return res;
  });
}

// ============================================================ start, lock, unlock
function showOnly(id) { ["lockScreen", "loadingScreen", "app"].forEach(function (x) { $(x).hidden = x !== id; }); }

function start() {
  UI.q = qOf(today());
  if (!KEY) { showOnly("lockScreen"); $("passInput").focus(); return; }
  showOnly("loadingScreen");
  loadAll().then(function (res) {
    if (res.success) { showOnly("app"); render(); }
    else if (res.error === "locked") { KEY = ""; try { localStorage.removeItem("jppfKey"); } catch (e) {} showOnly("lockScreen"); $("passErr").textContent = "That passcode didn't work."; }
    else { showOnly("lockScreen"); $("passErr").textContent = res.error || "Could not reach the spreadsheet."; }
  });
}
function unlock() {
  var v = $("passInput").value.trim();
  if (!v) return;
  KEY = v;
  try { localStorage.setItem("jppfKey", v); } catch (e) {}
  $("passErr").textContent = "";
  start();
}
function lockApp() {
  KEY = "";
  try { localStorage.removeItem("jppfKey"); } catch (e) {}
  D = { jobs: [], invoices: [], contracts: [], expenses: [], payments: [], settings: {} };
  $("passInput").value = "";
  closeModal();
  showOnly("lockScreen");
}
function reload() {
  $("saveBar").hidden = true;
  showOnly("loadingScreen");
  loadAll().then(function (res) {
    if (res.success) { showOnly("app"); render(); }
    else if (res.error === "locked") lockApp();
    else { showOnly("app"); render(); showSave("Couldn't reload: " + esc(res.error || ""), "bad"); }
  });
}

function deleteExpense(id) {
  if (!confirm("Delete this expense?")) return;
  D.expenses = D.expenses.filter(function (x) { return x.ID !== id; });
  closeModal(); render();
  save({ action: "deleteExpense", id: id });
}
function addSettingIfNew(key, value) {
  var list = setting(key, []);
  if (!value || list.some(function (x) { return String(x).toLowerCase() === value.toLowerCase(); })) return;
  list = list.concat([value]);
  D.settings[key] = list;
  save({ action: "saveSetting", key: key, value: list });
}

// ---------- Payment
function openPayment(id, jobId) {
  var p = id ? D.payments.find(function (x) { return x.ID === id; }) : null;
  var isNew = !p;
  if (isNew) {
    var j0 = jobById(jobId);
    p = { ID: "", JobID: jobId || "", DateReceived: today(), GrossAmount: j0 ? jobMoney(j0).owed || "" : "", Fees: "", Method: "", Notes: "" };
  }
  var owing = owingJobs().map(function (j) { return j.ID; });
  var jobs = D.jobs.slice().sort(function (a, b) {
    var ao = owing.indexOf(a.ID) >= 0 ? 0 : 1, bo = owing.indexOf(b.ID) >= 0 ? 0 : 1;
    return ao - bo || dateOnly(b.EventDate).localeCompare(dateOnly(a.EventDate));
  });
  var methods = uniq(setting("paymentMethods", ["Zelle", "Bank Transfer", "Venmo", "PayPal", "GoDaddy", "Cash App", "Cash", "Check"]));
  var h = "<h2>" + (isNew ? "Log money that came in" : "Edit payment") + "</h2>"
    + '<div class="field"><label>Which job is it for?</label><select id="pJob" onchange="payHint()"><option value="">Pick a job…</option>'
    + jobs.map(function (j) { var m = jobMoney(j); return '<option value="' + esc(j.ID) + '"' + (j.ID === p.JobID ? " selected" : "") + ">" + esc((m.owes ? "● " : "") + shortDate(j.EventDate) + " · " + (j.ClientName || "") + " · " + (j.JobName || "") + (m.owes ? " (owes " + money(m.owed) + ")" : "")) + "</option>"; }).join("")
    + '</select><div class="hint" id="payHint" style="margin-top:5px"></div></div>'
    + '<div class="r2"><div class="field"><label>Amount the client paid</label><input id="pAmt" type="number" step="0.01" value="' + esc(p.GrossAmount === "" ? "" : payGross(p) || p.GrossAmount) + '"></div>'
    + '<div class="field"><label>Date it arrived</label><input id="pDate" type="date" value="' + esc(dateOnly(p.DateReceived)) + '"></div></div>'
    + '<div class="r2"><div class="field"><label>How</label><input id="pMethod" list="methodList" placeholder="Zelle, Venmo, check…" value="' + esc(p.Method) + '">' + datalist("methodList", methods) + "</div>"
    + '<div class="field"><label>Fee taken (if any)</label><input id="pFee" type="number" step="0.01" placeholder="0.00" value="' + esc(num(p.Fees) ? p.Fees : "") + '"></div></div>'
    + '<div class="field"><label>Notes (optional)</label><input id="pNotes" value="' + esc(p.Notes) + '"></div>'
    + '<div class="modal-acts">' + (isNew ? "" : '<button class="btn danger left" ' + on("deletePayment", p.ID) + ">Delete</button>")
    + '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" ' + on("savePayment", p.ID) + ">Save payment</button></div>";
  openModal(h);
  payHint();
}
function payHint() {
  var j = jobById(val("pJob")), el = $("payHint"); if (!el) return;
  if (!j) { el.textContent = ""; return; }
  var m = jobMoney(j);
  el.textContent = "Job total " + money(m.total) + " · paid so far " + money(m.paid) + (m.owes ? " · still owed " + money(m.owed) : "");
  if (!val("pAmt") && m.owes) $("pAmt").value = m.owed;
}
function savePayment(id) {
  var job = jobById(val("pJob"));
  var gross = r2(num(val("pAmt"))), fee = r2(num(val("pFee")));
  if (!job) { alert("Pick which job this payment is for."); return; }
  if (!gross) { alert("Enter the amount."); return; }
  if (!dateOnly(val("pDate"))) { alert("Pick the date it arrived."); return; }
  var before = paymentsFor(job.ID).filter(function (x) { return x.ID !== id; });
  var paidBefore = before.reduce(function (s, x) { return s + payGross(x); }, 0);
  var type = paidBefore + gross >= num(job.GrossTotal) - 0.009 ? "Final Payment" : before.length ? "Partial" : "Deposit";
  var p = { ID: id || newId("pay"), JobID: job.ID, JobName: job.JobName || "", ClientName: job.ClientName || "", DateReceived: val("pDate"), Type: type, GrossAmount: gross, Fees: fee, NetAmount: r2(gross - fee), Method: val("pMethod"), Notes: val("pNotes") };
  var i = D.payments.findIndex(function (x) { return x.ID === p.ID; });
  if (i >= 0) D.payments[i] = p; else D.payments.push(p);
  closeModal(); render();
  save({ action: "savePayment", payment: p });
  syncJobStatus(job);
}
function deletePayment(id) {
  var p = D.payments.find(function (x) { return x.ID === id; });
  if (!p || !confirm("Delete this payment?")) return;
  D.payments = D.payments.filter(function (x) { return x.ID !== id; });
  closeModal(); render();
  save({ action: "deletePayment", id: id });
  var j = jobById(p.JobID); if (j) syncJobStatus(j);
}
// Keeps the sheet's PaymentStatus column honest after payments change.
function syncJobStatus(job) {
  var m = jobMoney(job);
  var st = m.total > 0 && m.paid >= m.total - 0.009 ? "Paid" : m.paid > 0 ? "Partial" : "Unpaid";
  if (job.PaymentStatus === st) return;
  job.PaymentStatus = st;
  save({ action: "saveJob", job: job });
}

// ---------- Job
function openJob(id) {
  var j = id ? jobById(id) : null;
  var isNew = !j;
  j = j || { ID: "", ClientName: "", JobName: "", ServiceType: "Photography", EventDate: today(), TaxStatus: "Taxable", TaxRate: DEFAULT_TAX_RATE, BaseCharge: "", TaxAmount: "", GrossTotal: "", Notes: "", PipelineData: {} };
  var services = uniq(setting("serviceTypes", ["Photography", "Videography", "Editing", "Drone", "Mixed"]));
  var taxes = uniq(setting("taxStatuses", ["Taxable", "Exempt", "Non-Profit", "Unknown"]));
  var clients = uniq(D.jobs.map(function (x) { return x.ClientName; }));
  var h = "<h2>" + (isNew ? "New job" : esc(j.JobName || "Job")) + "</h2>"
    + '<div class="r2"><div class="field"><label>Client</label><input id="jClient" list="clientList" value="' + esc(j.ClientName) + '">' + datalist("clientList", clients) + "</div>"
    + '<div class="field"><label>Job</label><input id="jName" placeholder="e.g. Senior photos, Odessa shoot" value="' + esc(j.JobName) + '"></div></div>'
    + '<div class="r2"><div class="field"><label>Date of the job</label><input id="jDate" type="date" value="' + esc(dateOnly(j.EventDate)) + '"></div>'
    + '<div class="field"><label>Type</label><select id="jService">' + options(services, j.ServiceType) + "</select></div></div>"
    + '<div class="r3"><div class="field"><label>Your fee</label><input id="jBase" type="number" step="0.01" placeholder="0.00" value="' + esc(j.BaseCharge) + '" oninput="recalc(true)"></div>'
    + '<div class="field"><label>Sales tax</label><select id="jTaxSt" onchange="taxStatusChanged()">' + options(taxes, j.TaxStatus) + "</select></div>"
    + '<div class="field" id="rateBox"><label>Tax rate %</label><input id="jRate" type="number" step="0.01" value="' + esc(j.TaxRate) + '" oninput="recalc(true)"></div></div>'
    + '<div class="field"><label class="lbl">Extras you bill for (mileage, rentals…)</label>' + linesHtml("jExtras", extrasOf(j), "e.g. Mileage 244 mi × $0.70") + '<button class="btn small" onclick="addLine(\'jExtras\',\'e.g. Mileage 244 mi × $0.70\')">+ Add extra</button></div>'
    + '<div class="total-line"><span>Tax <b class="num" id="jTaxShow" style="font-size:14px">' + money(j.TaxAmount) + '</b></span><span>Client pays <b class="num" id="jTotalShow">' + money(j.GrossTotal) + "</b></span></div>"
    + '<div class="field"><label>Notes</label><textarea id="jNotes" rows="2">' + esc(j.Notes) + "</textarea></div>";

  if (!isNew) {
    var m = jobMoney(j), pays = paymentsFor(j.ID), invs = invoicesFor(j.ID);
    h += '<div class="sub"><h4>Payments <span class="pill ' + m.cls + '">' + esc(m.label) + '</span><button class="btn small" ' + on("openPayment", "", j.ID) + ">+ Got paid</button></h4>";
    h += pays.length ? pays.map(function (p) { return '<div class="row" ' + on("openPayment", p.ID) + '><div class="date">' + esc(shortDate(p.DateReceived)) + '</div><div class="main"><div class="s">' + esc([p.Type, p.Method].filter(Boolean).join(" · ")) + '</div></div><div class="amt num">' + money(payGross(p)) + "</div></div>"; }).join("") : '<div class="empty" style="padding:6px 0">No payments yet.</div>';
    if (m.owes || isTrue(j.PaymentResolved)) h += '<label class="check" style="margin-top:8px"><input type="checkbox" id="jWriteOff"' + (isTrue(j.PaymentResolved) ? " checked" : "") + "> I won't be collecting the rest (write it off)</label>";
    h += "</div>";
    h += '<div class="sub"><h4>Invoices<button class="btn small" ' + on("openInvoice", "", j.ID) + ">+ Make invoice</button></h4>";
    h += invs.length ? invs.map(function (inv) { return '<div class="row" ' + on("openInvoiceView", inv.ID) + '><div class="date">#' + esc(inv.InvoiceNumber) + '</div><div class="main"><div class="s">' + esc(String(inv.Status).toLowerCase() === "draft" ? "Draft, not sent" : "Sent") + " · filed " + esc(niceDate(inv.DateFiled)) + '</div></div><div class="amt num">' + money(inv.TotalDue) + "</div></div>"; }).join("") : '<div class="empty" style="padding:6px 0">No invoice yet.</div>';
    h += "</div>";
  }
  h += '<div class="modal-acts">' + (isNew ? "" : '<button class="btn danger left" ' + on("deleteJob", j.ID) + ">Delete job</button>")
    + '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" ' + on("saveJob", j.ID) + ">Save job</button></div>";
  openModal(h);

  // Totals only recalculate once you change a number, so older jobs keep their saved totals.
  var touched = false;
  recalc = function (fromInput) {
    if (fromInput !== false) touched = true;
    if (!touched) return;
    var base = num(val("jBase")), taxable = val("jTaxSt") === "Taxable";
    var tax = taxable ? r2(base * num(val("jRate")) / 100) : 0;
    var extras = readLines("jExtras").reduce(function (s, x) { return s + x.amount; }, 0);
    $("jTaxShow").textContent = money(tax);
    $("jTotalShow").textContent = money(base + tax + extras);
  };
  $("jExtras").addEventListener("input", function () { recalc(true); });
  $("rateBox").hidden = val("jTaxSt") !== "Taxable";
  openJob.touched = function () { return touched; };
}
function taxStatusChanged() {
  var taxable = val("jTaxSt") === "Taxable";
  $("rateBox").hidden = !taxable;
  if (taxable && !num(val("jRate"))) $("jRate").value = DEFAULT_TAX_RATE;
  recalc(true);
}
function saveJob(id) {
  var old = id ? jobById(id) : null;
  if (!val("jClient") && !val("jName")) { alert("Give the job a client or a name."); return; }
  var base = r2(num(val("jBase"))), taxSt = val("jTaxSt"), taxable = taxSt === "Taxable";
  var rate = taxable ? num(val("jRate")) : 0;
  var extras = readLines("jExtras");
  var j = Object.assign({
    ClientLocation: "", JobLocation: "Lubbock", ProcessingFees: 0, NetReceived: 0, PaymentMethod: "",
    PaymentStatus: "Unpaid", PipelineStatus: "", ExpenseNotes: "", PaymentResolved: false, ResolvedReason: ""
  }, old || {}, {
    ID: id || newId("j"), ClientName: val("jClient"), JobName: val("jName"), EventDate: val("jDate"),
    ServiceType: val("jService"), TaxStatus: taxSt, TaxRate: rate, BaseCharge: base, Notes: val("jNotes")
  });
  var pd = Object.assign({}, parseMaybe(old && old.PipelineData, {}) || {});
  pd.billableItems = extras;
  j.PipelineData = pd;
  if (!old || openJob.touched()) {
    j.TaxAmount = taxable ? r2(base * rate / 100) : 0;
    j.GrossTotal = r2(base + j.TaxAmount + extras.reduce(function (s, x) { return s + x.amount; }, 0));
  }
  var wo = $("jWriteOff");
  if (wo) { j.PaymentResolved = wo.checked; j.ResolvedReason = wo.checked ? (j.ResolvedReason || "Write-off") : ""; }
  var i = D.jobs.findIndex(function (x) { return x.ID === j.ID; });
  if (i >= 0) D.jobs[i] = j; else D.jobs.push(j);
  var m = jobMoney(j);
  j.PaymentStatus = m.total > 0 && m.paid >= m.total - 0.009 ? "Paid" : m.paid > 0 ? "Partial" : "Unpaid";
  closeModal(); render();
  save({ action: "saveJob", job: j });
}
function deleteJob(id) {
  var j = jobById(id); if (!j) return;
  var n = paymentsFor(id).length + invoicesFor(id).length;
  if (!confirm("Delete \"" + (j.JobName || j.ClientName) + "\"?" + (n ? "\n\nIts " + n + " payment/invoice record(s) stay in the spreadsheet but will no longer be linked to a job." : ""))) return;
  D.jobs = D.jobs.filter(function (x) { return x.ID !== id; });
  closeModal(); render();
  save({ action: "deleteJob", id: id });
}

// ---------- Invoice machine
function nextInvoiceNumber() { return D.invoices.reduce(function (m, i) { return Math.max(m, num(i.InvoiceNumber)); }, 1047) + 1; }
function lastBillTo(client) {
  var c = String(client || "").trim().toLowerCase(); if (!c) return "";
  var hit = D.invoices.filter(function (i) { return String(i.ClientName).trim().toLowerCase() === c && i.BillToAddress; })
    .sort(function (a, b) { return num(b.InvoiceNumber) - num(a.InvoiceNumber); })[0];
  return hit ? hit.BillToAddress : "";
}
function pickJobForInvoice() {
  var jobs = D.jobs.slice().sort(function (a, b) {
    var ai = invoicesFor(a.ID).length ? 1 : 0, bi = invoicesFor(b.ID).length ? 1 : 0;
    return ai - bi || dateOnly(b.EventDate).localeCompare(dateOnly(a.EventDate));
  });
  var h = "<h2>Invoice which job?</h2><div class=\"hint\" style=\"margin-bottom:10px\">Jobs without an invoice are listed first. Everything fills in from the job.</div>"
    + jobs.map(function (j) { var n = invoicesFor(j.ID).length; return '<div class="row" ' + on("openInvoice", "", j.ID) + '><div class="date">' + esc(shortDate(j.EventDate)) + '</div><div class="main"><div class="t">' + esc((j.ClientName || "") + " · " + (j.JobName || "")) + '</div><div class="s">' + (n ? n + " invoice" + (n > 1 ? "s" : "") + " already" : "No invoice yet") + '</div></div><div class="amt num">' + money(j.GrossTotal) + "</div></div>"; }).join("")
    + '<div class="modal-acts"><button class="btn left" ' + on("openInvoice", "", "") + '>Blank invoice (no job)</button><button class="btn" onclick="closeModal()">Cancel</button></div>';
  openModal(h);
}
function openInvoiceView(id) { closeModal(); showInvoice(id); }
function openInvoice(id, jobId) {
  var inv = id ? D.invoices.find(function (i) { return i.ID === id; }) : null;
  var isNew = !inv;
  if (isNew) {
    var j = jobById(jobId);
    var lines = [];
    if (j) {
      var extras = extrasOf(j).filter(function (x) { return x.desc || num(x.amount); });
      var extraSum = extras.reduce(function (s, x) { return s + num(x.amount); }, 0);
      var fee = num(j.GrossTotal) > 0 ? r2(num(j.GrossTotal) - num(j.TaxAmount) - extraSum) : num(j.BaseCharge);
      lines.push({ desc: (j.ServiceType || "Service") + (j.JobName ? ": " + j.JobName : ""), amount: fee });
      extras.forEach(function (x) { lines.push({ desc: x.desc, amount: r2(num(x.amount)) }); });
    } else lines.push({ desc: "", amount: "" });
    var paid = j ? jobMoney(j).paid : 0;
    inv = { ID: "", InvoiceNumber: nextInvoiceNumber(), JobID: j ? j.ID : "", ClientName: j ? j.ClientName : "", BillToAddress: j ? lastBillTo(j.ClientName) : "",
      DateOfService: j ? dateOnly(j.EventDate) : "", DateFiled: today(), ServiceProvided: j ? j.ServiceType : "", Project: j ? j.JobName : "",
      CostBreakdown: lines, SalesTax: j ? num(j.TaxAmount) : 0, Deposit: paid, TotalDue: 0, PaymentTerms: "Net 30", Status: "Draft", Notes: "" };
    inv.TotalDue = r2(lines.reduce(function (s, x) { return s + num(x.amount); }, 0) + inv.SalesTax - inv.Deposit);
  }
  var h = "<h2>" + (isNew ? "New invoice" : "Edit invoice #" + esc(inv.InvoiceNumber)) + "</h2>"
    + '<div class="r3"><div class="field"><label>Invoice #</label><input id="iNum" value="' + esc(inv.InvoiceNumber) + '"></div>'
    + '<div class="field"><label>Invoice date</label><input id="iFiled" type="date" value="' + esc(dateOnly(inv.DateFiled)) + '"></div>'
    + '<div class="field"><label>Service date</label><input id="iServiceDate" type="date" value="' + esc(dateOnly(inv.DateOfService)) + '"></div></div>'
    + '<div class="r2"><div class="field"><label>Client</label><input id="iClient" value="' + esc(inv.ClientName) + '" onchange="if(!val(\'iBill\'))$(\'iBill\').value=lastBillTo(this.value)"></div>'
    + '<div class="field"><label>Project</label><input id="iProject" value="' + esc(inv.Project) + '"></div></div>'
    + '<div class="field"><label>Bill-to address</label><textarea id="iBill" rows="2">' + esc(inv.BillToAddress) + "</textarea></div>"
    + '<div class="field"><label>Service provided</label><input id="iService" value="' + esc(inv.ServiceProvided) + '"></div>'
    + '<div class="field"><label class="lbl">Line items</label>' + linesHtml("iLines", invLines(inv).length ? invLines(inv) : [{}], "Description") + '<button class="btn small" onclick="addLine(\'iLines\',\'Description\')">+ Add line</button></div>'
    + '<div class="r3"><div class="field"><label>Sales tax</label><input id="iTax" type="number" step="0.01" value="' + esc(inv.SalesTax) + '" oninput="recalc()"></div>'
    + '<div class="field"><label>Already paid</label><input id="iDep" type="number" step="0.01" value="' + esc(inv.Deposit) + '" oninput="recalc()"></div>'
    + '<div class="field"><label>Terms</label><input id="iTerms" value="' + esc(inv.PaymentTerms) + '"></div></div>'
    + '<div class="total-line"><span>Total due</span><b class="num" id="iTotalShow">' + money(inv.TotalDue) + "</b></div>"
    + '<div class="field"><label>Note on the invoice (optional)</label><input id="iNotes" value="' + esc(inv.Notes) + '"></div>'
    + '<div class="modal-acts"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" ' + on("saveInvoice", inv.ID, inv.JobID, inv.Status) + ">Save &amp; preview</button></div>";
  openModal(h);
  recalc = function () {
    var sub = readLines("iLines").reduce(function (s, x) { return s + x.amount; }, 0);
    $("iTotalShow").textContent = money(sub + num(val("iTax")) - num(val("iDep")));
  };
  $("iLines").addEventListener("input", function () { recalc(); });
}
function saveInvoice(id, jobId, status) {
  var lines = readLines("iLines");
  var inv = { ID: id || newId("inv"), InvoiceNumber: val("iNum"), JobID: jobId || "", ClientName: val("iClient"), BillToAddress: val("iBill"),
    DateOfService: val("iServiceDate"), DateFiled: val("iFiled"), ServiceProvided: val("iService"), Project: val("iProject"),
    CostBreakdown: lines, SalesTax: r2(num(val("iTax"))), Deposit: r2(num(val("iDep"))), PaymentTerms: val("iTerms"), Status: status || "Draft", Notes: val("iNotes") };
  inv.TotalDue = r2(lines.reduce(function (s, x) { return s + x.amount; }, 0) + inv.SalesTax - inv.Deposit);
  if (!inv.InvoiceNumber) { alert("Give it an invoice number."); return; }
  var dup = D.invoices.find(function (i) { return i.ID !== inv.ID && String(i.InvoiceNumber) === String(inv.InvoiceNumber); });
  if (dup && !confirm("Invoice #" + inv.InvoiceNumber + " already exists. Use the same number anyway?")) return;
  var i = D.invoices.findIndex(function (x) { return x.ID === inv.ID; });
  if (i >= 0) D.invoices[i] = inv; else D.invoices.push(inv);
  closeModal(); showInvoice(inv.ID);
  save({ action: "saveInvoice", invoice: inv });
}

// ============================================================ CSV for taxes
function csvCell(v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCsv(k) {
  var n = quarterNumbers(k), rows = [["Type", "Date", "Client / vendor", "What", "Category", "Method", "Amount", "Sales tax inside", "Fee"]];
  n.pays.forEach(function (p) { var j = jobById(p.JobID); rows.push(["Income", dateOnly(p.DateReceived), p.ClientName || (j && j.ClientName) || "", p.JobName || (j && j.JobName) || "", "", p.Method, payGross(p).toFixed(2), taxInside(p).toFixed(2), num(p.Fees).toFixed(2)]); });
  n.exps.forEach(function (e) { rows.push(["Expense", dateOnly(e.Date), "", e.Description, e.Category, "", num(e.Amount).toFixed(2), "", ""]); });
  rows.push([]);
  rows.push(["Summary " + qLabel(k)]);
  rows.push(["Money in", "", "", "", "", "", n.moneyIn.toFixed(2)]);
  rows.push(["Sales tax collected", "", "", "", "", "", n.tax.toFixed(2)]);
  rows.push(["Payment fees", "", "", "", "", "", n.fees.toFixed(2)]);
  rows.push(["Expenses", "", "", "", "", "", n.spent.toFixed(2)]);
  rows.push(["You kept", "", "", "", "", "", n.kept.toFixed(2)]);
  var csv = rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "JPPF-" + qLabel(k).replace(" ", "-") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

window.addEventListener("beforeunload", function (e) { if (pendingWrites) { e.preventDefault(); e.returnValue = ""; } });
start();
</script>
